<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Chatbot ذكي يعمل بدون إنترنت - دردشة مجانية بالعربية">
    <meta name="keywords" content="chatbot, ai, ذكاء اصطناعي, دردشة, عربي">
    <meta name="author" content="OtmanMomo">
    <meta name="theme-color" content="#667eea">
    <title>🤖 AI Chatbot - دردشة ذكية</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- الحاوية الرئيسية -->
    <div class="container">
        <!-- رأس التطبيق -->
        <div class="header">
            <div class="header-content">
                <h1>🤖 AI Chatbot</h1>
                <p>مساعد ذكي يعمل بالذكاء الاصطناعي الحقيقي</p>
                <div class="header-controls">
                    <button id="themeToggle" class="btn-icon" aria-label="تبديل الوضع الليلي" title="تبديل الوضع">
                        🌙
                    </button>
                    <button id="clearChat" class="btn-icon" aria-label="مسح المحادثة" title="مسح المحادثة">
                        🗑️
                    </button>
                    <button id="historyBtn" class="btn-icon" aria-label="عرض السجل" title="السجل">
                        📋
                    </button>
                </div>
            </div>
            <div id="connectionStatus" class="connection-status">
                <span class="status-dot online"></span>
                <span>متصل</span>
            </div>
        </div>

        <!-- منطقة الدردشة -->
        <div class="chat-container">
            <div class="chat-box" id="chatBox" role="log" aria-live="polite" aria-label="منطقة الدردشة">
                <div class="welcome-section">
                    <div class="welcome-icon">👋</div>
                    <h2>أهلا وسهلا!</h2>
                    <p>أنا مساعد ذكي هنا لمساعدتك في أي سؤال</p>
                    <div class="quick-actions">
                        <button class="quick-btn" data-prompt="من أنت">من أنت؟</button>
                        <button class="quick-btn" data-prompt="ماذا تستطيع أن تفعل">ماذا تستطيع؟</button>
                        <button class="quick-btn" data-prompt="أخبرني عن نفسك">عن نفسك</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- منطقة الإدخال -->
        <div class="input-area">
            <div class="input-group">
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="اكتب سؤالك هنا..."
                    autocomplete="off"
                    aria-label="حقل الإدخال"
                    maxlength="500"
                >
                <button id="sendBtn" class="send-button" aria-label="إرسال الرسالة" title="إرسال (Enter)">
                    <span class="send-icon">➤</span>
                </button>
            </div>
            <div class="input-hints">
                <small>💡 اضغط Enter لإرسال الرسالة</small>
            </div>
        </div>
    </div>

    <!-- نافذة السجل -->
    <div id="historyModal" class="modal" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📋 سجل المحادثات</h2>
                <button id="closeHistory" class="close-btn" aria-label="إغلاق">&times;</button>
            </div>
            <div id="historyList" class="history-list">
                <!-- سيتم ملء هذا ديناميكياً -->
            </div>
            <div class="modal-footer">
                <button id="exportHistory" class="btn-primary">📥 تحميل السجل</button>
                <button id="clearHistory" class="btn-danger">🗑️ حذف السجل</button>
            </div>
        </div>
    </div>

    <!-- نافذة إدخال API Key -->
    <div id="apiModal" class="modal" aria-hidden="true">
        <div class="modal-content modal-sm">
            <div class="modal-header">
                <h2>🔑 إدخال API Key</h2>
                <button id="closeApiModal" class="close-btn" aria-label="إغلاق">&times;</button>
            </div>
            <div class="modal-body">
                <p>أدخل Hugging Face API Key للحصول على ذكاء اصطناعي حقيقي:</p>
                <input 
                    type="password" 
                    id="apiKeyInput" 
                    placeholder="أدخل API Key هنا"
                    class="input-field"
                >
                <p class="hint">
                    <a href="https://huggingface.co/settings/tokens" target="_blank" rel="noopener">احصل على API Key من هنا</a>
                </p>
            </div>
            <div class="modal-footer">
                <button id="saveApiKey" class="btn-primary">💾 حفظ</button>
                <button id="skipApiKey" class="btn-secondary">تخطي</button>
            </div>
        </div>
    </div>

    <!-- إشعارات -->
    <div id="notification" class="notification" role="alert" aria-live="assertive"></div>

    <script src="ai.js"></script>
</body>
</html>
